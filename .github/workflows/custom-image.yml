name: Build custom new-api image

on:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths: ['.linjzy/**', '.github/workflows/custom-image.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Published upstream release tag; empty selects the newest non-draft release
        required: false
        type: string
      promote_candidate:
        description: Move candidate after all checks pass
        default: false
        type: boolean
      extended_checks:
        description: Also verify MySQL compatibility and the concurrency race detector
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: custom-new-api-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve exact upstream and content identities
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_RELEASE: ${{ inputs.release || '' }}
          EXTENDED: ${{ inputs.extended_checks || false }}
          BEFORE: ${{ github.event.before || '' }}
        run: |
          set -Eeuo pipefail
          release="$REQUESTED_RELEASE"
          if [[ -z "$release" ]]; then
            release="$(gh api 'repos/QuantumNous/new-api/releases?per_page=30' --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name')"
          fi
          [[ "$release" =~ ^v?[0-9][A-Za-z0-9._-]*$ ]]
          git fetch --no-tags --depth=1 https://github.com/QuantumNous/new-api.git "refs/tags/$release"
          upstream="$(git rev-parse 'FETCH_HEAD^{commit}')"
          python3 .linjzy/bin/release-inputs.py .linjzy > "$RUNNER_TEMP/identities.env"
          source "$RUNNER_TEMP/identities.env"
          tag="${release#v}-custom-${build_sha:0:12}-${upstream:0:12}"
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/new-api"
          extended="$EXTENDED"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]] ||
             { [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] &&
               ! git diff --quiet "$BEFORE" HEAD -- .linjzy/patches/sequential-key-mode.patch .linjzy/patches/responses-capacity-retry.patch .linjzy/tests/go .linjzy/bin/prepare-release.py; }; then
            extended=true
          fi
          {
            echo "release=$release"
            echo "upstream=$upstream"
            cat "$RUNNER_TEMP/identities.env"
            echo "source_ref=custom/$tag"
            echo "image=$repository:$tag"
            echo "proof=$repository:verified-${validation_sha:0:12}-${extended}-$tag"
            echo "candidate=$repository:candidate"
            echo "extended=$extended"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable image and matching validation before preparing source
        id: registry
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          PROOF: ${{ steps.plan.outputs.proof }}
          SOURCE_REF: ${{ steps.plan.outputs.source_ref }}
        run: |
          set -Eeuo pipefail
          digest=''
          source_refs="$(git ls-remote --heads origin "refs/heads/$SOURCE_REF")"
          if [[ -n "$source_refs" ]]; then
            digest="$(bash .linjzy/bin/registry-digest.sh "$IMAGE")"
          fi
          proof="$(bash .linjzy/bin/registry-digest.sh "$PROOF")"
          echo "exists=$([[ -n "$digest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "verified=$([[ -n "$digest" && "$digest" == "$proof" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Prepare exact source and current verification bundle
        if: steps.registry.outputs.verified != 'true'
        id: source
        env:
          SOURCE_REF: ${{ steps.plan.outputs.source_ref }}
          UPSTREAM: ${{ steps.plan.outputs.upstream }}
          RELEASE: ${{ steps.plan.outputs.release }}
          BUILD_SHA: ${{ steps.plan.outputs.build_sha }}
        run: |
          set -Eeuo pipefail
          cp -R .linjzy "$RUNNER_TEMP/current-custom"
          cp .github/workflows/custom-image.yml "$RUNNER_TEMP/custom-image.yml"
          source_refs="$(git ls-remote --heads origin "refs/heads/$SOURCE_REF")"
          if [[ -n "$source_refs" ]]; then
            git fetch --depth=1 origin "refs/heads/$SOURCE_REF"
            git checkout --detach FETCH_HEAD
          else
            git checkout --detach "$UPSTREAM"
            cp -R "$RUNNER_TEMP/current-custom" .linjzy
            bash .linjzy/bin/prepare-release.sh . "$RELEASE" "$UPSTREAM" "$SOURCE_REF"
            printf 'build_sha256=%s\n' "$BUILD_SHA" >> .linjzy/BUILD-METADATA
            git add -A
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "custom: $RELEASE production customizations"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.registry.outputs.verified != 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Verify relay, settlement, sequential keys and deployment contract
        if: steps.registry.outputs.verified != 'true'
        run: |
          set -Eeuo pipefail
          bash "$RUNNER_TEMP/current-custom/bin/verify-release.sh" "$PWD" go
          CUSTOM_WORKFLOW_FILE="$RUNNER_TEMP/custom-image.yml" python3 -m unittest discover -s "$RUNNER_TEMP/current-custom/tests" -p 'test_*.py'

      - name: Verify PostgreSQL key recovery
        if: steps.registry.outputs.verified != 'true'
        env:
          CUSTOM_TEST_SQL_DRIVER: postgres
          CUSTOM_TEST_SQL_DSN: host=127.0.0.1 port=55432 user=newapi password=ci-only dbname=newapi_test sslmode=disable
        run: |
          set -Eeuo pipefail
          docker run -d --name custom-postgres -p 127.0.0.1:55432:5432 -e POSTGRES_USER=newapi -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=newapi_test --health-cmd='pg_isready -U newapi -d newapi_test' --health-interval=1s --health-retries=30 postgres:15-alpine
          # shellcheck disable=SC2016
          timeout 45 bash -c 'until [[ "$(docker inspect --format "{{.State.Health.Status}}" custom-postgres)" == healthy ]]; do sleep 1; done'
          bash "$RUNNER_TEMP/current-custom/bin/verify-release.sh" "$PWD" database

      - name: Verify changed backend concurrency and MySQL compatibility
        if: steps.registry.outputs.verified != 'true' && steps.plan.outputs.extended == 'true'
        env:
          CUSTOM_TEST_SQL_DRIVER: mysql
          CUSTOM_TEST_SQL_DSN: newapi:ci-only@tcp(127.0.0.1:53306)/newapi_test?charset=utf8mb4&parseTime=True&loc=UTC
        run: |
          set -Eeuo pipefail
          docker run -d --name custom-mysql -p 127.0.0.1:53306:3306 -e MYSQL_ROOT_PASSWORD=ci-only -e MYSQL_USER=newapi -e MYSQL_PASSWORD=ci-only -e MYSQL_DATABASE=newapi_test --health-cmd='mysqladmin ping -h 127.0.0.1 -pci-only --silent' --health-interval=1s --health-retries=60 mysql:8.4
          # shellcheck disable=SC2016
          timeout 90 bash -c 'until [[ "$(docker inspect --format "{{.State.Health.Status}}" custom-mysql)" == healthy ]]; do sleep 1; done'
          bash "$RUNNER_TEMP/current-custom/bin/verify-release.sh" "$PWD" database
          unset CUSTOM_TEST_SQL_DSN CUSTOM_TEST_SQL_DRIVER
          bash "$RUNNER_TEMP/current-custom/bin/verify-release.sh" "$PWD" race

      - name: Install pinned frontend runner
        if: steps.registry.outputs.verified != 'true'
        run: npm install --global bun@1.4.0

      - name: Verify frontend errors, lint and types
        env:
          BUILD_FRONTEND: false
        if: steps.registry.outputs.verified != 'true'
        run: bash "$RUNNER_TEMP/current-custom/bin/verify-release.sh" "$PWD" frontend

      - name: Build or fetch immutable image and verify startup
        if: steps.registry.outputs.verified != 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          IMAGE_EXISTS: ${{ steps.registry.outputs.exists }}
          RELEASE: ${{ steps.plan.outputs.release }}
          UPSTREAM: ${{ steps.plan.outputs.upstream }}
          PATCH_SHA: ${{ steps.plan.outputs.patch_sha }}
          BUILD_SHA: ${{ steps.plan.outputs.build_sha }}
          SOURCE_REF: ${{ steps.plan.outputs.source_ref }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -Eeuo pipefail
          if [[ "$IMAGE_EXISTS" == true ]]; then
            docker pull "$IMAGE"
          else
            docker buildx build --load --platform linux/amd64 --pull \
              --cache-from type=gha,scope=new-api-custom-amd64 \
              --cache-to type=gha,mode=max,scope=new-api-custom-amd64 \
              --label 'com.linjzy.new-api.managed=true' \
              --label "com.linjzy.new-api.upstream-tag=$RELEASE" \
              --label "com.linjzy.new-api.upstream-commit=$UPSTREAM" \
              --label "com.linjzy.new-api.patch-sha256=$PATCH_SHA" \
              --label "com.linjzy.new-api.build-sha256=$BUILD_SHA" \
              --label "com.linjzy.new-api.source-ref=$SOURCE_REF" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$COMMIT" \
              --label "org.opencontainers.image.version=$RELEASE" \
              --label 'org.opencontainers.image.licenses=AGPL-3.0-only' --tag "$IMAGE" .
          fi
          bash "$RUNNER_TEMP/current-custom/bin/smoke-test-image.sh" "$IMAGE" "$RELEASE"
          git push origin "HEAD:refs/heads/$SOURCE_REF"
          docker push "$IMAGE"

      - name: Record validation and promote candidate
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          PROOF: ${{ steps.plan.outputs.proof }}
          CANDIDATE: ${{ steps.plan.outputs.candidate }}
          VERIFIED: ${{ steps.registry.outputs.verified }}
          PROMOTE: ${{ github.event_name == 'schedule' || inputs.promote_candidate || false }}
          BUILD_SHA: ${{ steps.plan.outputs.build_sha }}
          VALIDATION_SHA: ${{ steps.plan.outputs.validation_sha }}
          SOURCE_REF: ${{ steps.plan.outputs.source_ref }}
        run: |
          set -Eeuo pipefail
          if [[ "$VERIFIED" != true ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$PROOF" "$IMAGE"
          fi
          if [[ "$PROMOTE" == true ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$CANDIDATE" "$IMAGE"
          fi
          # shellcheck disable=SC2016
          digest="$(docker buildx imagetools inspect "$IMAGE" | awk '/^Digest:/ {print $2; exit}')"
          # shellcheck disable=SC2016
          {
            printf 'Image: `%s`\n\nDigest: `%s`\n\n' "$IMAGE" "$digest"
            printf 'Build inputs: `%s`\n\nValidation: `%s`\n\n' "$BUILD_SHA" "$VALIDATION_SHA"
            printf 'Source: https://github.com/%s/tree/%s\n\n' "$GITHUB_REPOSITORY" "$SOURCE_REF"
            printf 'Validation reused: %s; candidate promoted: %s\n' "$VERIFIED" "$PROMOTE"
          } >> "$GITHUB_STEP_SUMMARY"
